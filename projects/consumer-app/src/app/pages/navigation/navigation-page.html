<div class="flex flex-col gap-6">
  <h1 class="font-heading text-3xl font-semibold">Navigation</h1>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
    <section
      id="breadcrumb"
      class="scroll-mt-24 flex flex-col gap-4 rounded-2xl border border-border p-6"
    >
      <h2 class="font-heading text-2xl font-semibold">Breadcrumb</h2>
      <rnd-breadcrumb [items]="breadcrumbItems" />
    </section>

    <section
      id="pagination"
      class="scroll-mt-24 flex flex-col gap-4 rounded-2xl border border-border p-6"
    >
      <h2 class="font-heading text-2xl font-semibold">Pagination</h2>
      <rnd-pagination [page]="3" [totalPages]="7" />

      <h3 class="font-heading text-lg text-muted">Restricted size + rotate</h3>
      <rnd-pagination [page]="10" [totalPages]="20" [maxSize]="5" [rotate]="true" />
    </section>

    <section
      id="tabs"
      class="scroll-mt-24 flex flex-col gap-4 rounded-2xl border border-border p-6"
    >
      <h2 class="font-heading text-2xl font-semibold">Tabs</h2>
      <rnd-tabs activeValue="overview">
        <rnd-tab value="overview">Overview</rnd-tab>
        <rnd-tab value="activity">Activity</rnd-tab>
        <rnd-tab value="settings">Settings</rnd-tab>
      </rnd-tabs>

      <h3 class="font-heading text-lg text-muted">Pills</h3>
      <rnd-tabs activeValue="overview" variant="pills">
        <rnd-tab value="overview">Overview</rnd-tab>
        <rnd-tab value="activity">Activity</rnd-tab>
        <rnd-tab value="settings">Settings</rnd-tab>
      </rnd-tabs>
    </section>
  </div>
</div>
