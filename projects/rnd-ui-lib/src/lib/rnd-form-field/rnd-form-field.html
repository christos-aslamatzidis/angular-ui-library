<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label class="font-body text-sm font-medium text-foreground">
      {{ label() }}
      @if (required()) {
        <span class="text-error">*</span>
      }
    </label>
  }
  <ng-content />
  @if (error()) {
    <p class="text-xs text-error">{{ error() }}</p>
  } @else if (hint()) {
    <p class="text-xs text-muted">{{ hint() }}</p>
  }
</div>
