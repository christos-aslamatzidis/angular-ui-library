<div
  class="flex h-12 items-center gap-2 border-b-2 border-white/20 bg-black/50 px-4 transition-all duration-200 focus-within:border-primary focus-within:shadow-[0_10px_20px_-10px_rgba(247,147,26,0.3)]"
>
  <rnd-icon name="search" [size]="16" class="shrink-0 text-muted" />
  <input
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="w-full bg-transparent text-sm text-white focus:outline-none disabled:cursor-not-allowed placeholder:text-white/30"
  />
  @if (value()) {
    <button
      type="button"
      class="shrink-0 rounded-full p-0.5 text-muted transition-colors hover:bg-white/10 hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      aria-label="Clear search"
      (click)="clear()"
    >
      <rnd-icon name="close" [size]="12" />
    </button>
  }
</div>
