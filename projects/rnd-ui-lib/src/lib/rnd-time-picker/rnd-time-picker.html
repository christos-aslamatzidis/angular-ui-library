<div class="flex items-center gap-3 rounded-lg border-b-2 border-white/20 bg-black/50 px-4 py-3">
  <rnd-number-stepper
    [value]="draftHour()"
    [min]="1"
    [max]="12"
    (valueChange)="onHourChange($event)"
  />
  <span class="font-heading text-lg font-semibold text-white">:</span>
  <rnd-number-stepper
    [value]="draftMinute()"
    [min]="0"
    [max]="59"
    (valueChange)="onMinuteChange($event)"
  />
  <rnd-segmented-control [activeValue]="draftPeriod()" (activeValueChange)="onPeriodChange($event)">
    <rnd-segmented-option value="AM">AM</rnd-segmented-option>
    <rnd-segmented-option value="PM">PM</rnd-segmented-option>
  </rnd-segmented-control>
</div>
