<div [class]="containerClasses()">
  <ng-content select="[rndInputPrefix]" />
  <input
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="w-full bg-transparent text-sm text-white focus:outline-none disabled:cursor-not-allowed placeholder:text-white/30"
  />
  <ng-content select="[rndInputSuffix]" />
</div>
