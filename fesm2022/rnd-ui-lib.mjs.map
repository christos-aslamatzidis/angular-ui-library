<div
  class="flex flex-wrap items-center gap-2 border-b-2 border-white/20 bg-black/50 px-4 py-2 transition-all duration-200 focus-within:border-primary"
>
  @for (tag of tags(); track tag; let i = $index) {
    <span
      class="inline-flex items-center gap-1 rounded-full bg-white/10 px-2.5 py-1 font-mono text-xs text-foreground"
    >
      {{ tag }}
      <button
        type="button"
        class="text-muted transition-colors hover:text-error"
        aria-label="Remove tag"
        (click)="removeTag(i)"
      >
        <rnd-icon name="close" [size]="10" />
      </button>
    </span>
  }
  <input
    type="text"
    class="min-w-24 flex-1 bg-transparent py-1 text-sm text-white focus:outline-none placeholder:text-white/30"
    [placeholder]="placeholder()"
    [value]="draft()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
</div>
