<div [class]="classes()" role="alert">
  <ng-content select="[rndAlertIcon]" />
  <div class="flex-1 font-body text-sm text-foreground">
    <ng-content />
  </div>
  @if (dismissible()) {
    <button
      type="button"
      class="shrink-0 rounded-full p-0.5 hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      aria-label="Dismiss"
      (click)="dismiss.emit()"
    >
      <rnd-icon name="close" [size]="14" />
    </button>
  }
</div>
