@if (orientation() === 'vertical') {
  <span class="inline-block h-4 w-px self-stretch bg-border"></span>
} @else if (label()) {
  <div class="flex items-center gap-4">
    <span class="h-px flex-1 bg-border"></span>
    <span class="font-mono text-xs tracking-wider text-muted uppercase">{{ label() }}</span>
    <span class="h-px flex-1 bg-border"></span>
  </div>
} @else {
  <span class="block h-px w-full bg-border"></span>
}
