<div class="relative">
  <button
    #trigger
    type="button"
    [attr.popovertarget]="panelId"
    [disabled]="disabled()"
    [class]="containerClasses()"
  >
    <span [class.text-white/30]="!selectedLabel()">{{ selectedLabel() || placeholder() }}</span>
    <rnd-icon name="chevron-down" [size]="16" class="pointer-events-none text-white/50" />
  </button>
  <div
    #panel
    [id]="panelId"
    popover
    (toggle)="onToggle($event)"
    class="m-0 max-h-64 overflow-y-auto rounded-xl border border-border bg-[#0f1115]/95 p-1.5 text-foreground backdrop-blur-lg"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="flex w-full items-center rounded-lg px-3 py-2 text-left text-sm transition-colors hover:bg-white/10"
        [class.bg-white/10]="option.value === value()"
        (click)="chooseOption(option)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>
