<div class="flex items-center gap-2 rounded-lg border border-white/10 bg-black/50 px-3 py-2">
  <span class="flex-1 truncate font-mono text-sm text-foreground">{{ displayValue() }}</span>
  <button
    type="button"
    class="shrink-0 rounded-md p-1.5 text-muted transition-colors hover:bg-white/10 hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
    [attr.aria-label]="copied() ? 'Copied' : 'Copy'"
    (click)="onCopy()"
  >
    @if (copied()) {
      <rnd-icon name="check" [size]="14" class="text-success" />
    } @else {
      <rnd-icon name="copy" [size]="14" />
    }
  </button>
</div>
