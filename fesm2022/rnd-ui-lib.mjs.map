<div class="flex flex-col gap-2">
  <button
    type="button"
    class="flex items-center gap-2 text-sm font-medium text-foreground transition-colors hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <rnd-icon
      name="chevron-right"
      [size]="14"
      class="shrink-0 transition-transform duration-300"
      [class.rotate-90]="open()"
    />
    {{ label() }}
  </button>
  @if (open()) {
    <div class="pl-5 text-sm text-muted">
      <ng-content />
    </div>
  }
</div>
