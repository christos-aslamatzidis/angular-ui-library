<button
  type="button"
  role="tab"
  [attr.aria-selected]="active()"
  [class]="classes()"
  (click)="onClick()"
>
  <ng-content />
  @if (active() && tabs.variant() === 'underline') {
    <span
      class="absolute inset-x-0 -bottom-px h-0.5 rounded-full bg-gradient-to-r from-secondary to-primary"
    ></span>
  }
</button>
