<span class="relative inline-flex" (mouseenter)="scheduleOpen()" (mouseleave)="scheduleClose()">
  <ng-content select="[rndHoverCardTrigger]" />
  @if (open()) {
    <div
      class="absolute top-full left-0 z-50 mt-2 w-72 rounded-xl border border-border bg-[#0f1115]/95 p-4 text-foreground shadow-[0_0_30px_-10px_rgba(0,0,0,0.6)] backdrop-blur-lg"
      (mouseenter)="scheduleOpen()"
      (mouseleave)="scheduleClose()"
    >
      <ng-content />
    </div>
  }
</span>
