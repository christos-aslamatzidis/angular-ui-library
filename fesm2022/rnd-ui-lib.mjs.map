<div [class]="containerClasses()">
  <input
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="w-full bg-transparent text-sm text-white focus:outline-none disabled:cursor-not-allowed placeholder:text-white/30"
  />
  <button
    type="button"
    class="shrink-0 text-muted transition-colors hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    (click)="toggleVisibility()"
  >
    @if (visible()) {
      <rnd-icon name="eye-off" [size]="16" />
    } @else {
      <rnd-icon name="eye" [size]="16" />
    }
  </button>
</div>
