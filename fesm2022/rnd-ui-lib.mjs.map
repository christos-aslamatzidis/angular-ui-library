<div class="flex items-center gap-3 rounded-xl px-3 py-3 transition-colors hover:bg-white/5">
  <ng-content select="[rndAssetRowIcon]" />
  <div class="flex flex-1 flex-col">
    <span class="font-body text-sm font-medium text-foreground">{{ name() }}</span>
    <span class="font-mono text-xs text-muted uppercase">{{ symbol() }}</span>
  </div>
  <div class="flex flex-col items-end">
    <span class="font-body text-sm font-medium text-foreground">{{ balance() }}</span>
    <div class="flex items-center gap-1.5 text-xs">
      @if (value()) {
        <span class="text-muted">{{ value() }}</span>
      }
      @if (delta() !== undefined) {
        <span [class]="deltaClasses()">{{ delta() }}%</span>
      }
    </div>
  </div>
</div>
